name: Build Spazio Admin APK
on:
  push:
    paths:
      - 'spazio-admin-android/**'
      - '.github/workflows/build-spazio-admin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: spazio-admin-android
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spazio-admin-apk
          path: spazio-admin-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spazio-admin-v1.0.0
          name: Spazio Admin Android v1.0.0
          files: spazio-admin-android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
